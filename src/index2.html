<!DOCTYPE html>
<html>
<head>
    <title>Travel Buddy Finder</title>
</head>
<body>

<h2>Travel Buddy Finder</h2>

<form action="/travellers" method="POST">

    Traveller ID:
    <input type="text" name="travellerId"><br><br>

    Name:
    <input type="text" name="name"><br><br>

    Destination:
    <input type="text" name="destination"><br><br>

    Travel Date:
    <input type="date" name="travelDate"><br><br>

    <button type="submit">Add Traveller</button>

</form>

</body>
</html>
